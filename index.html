<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<title>Einkaufsliste</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f2f2f7; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 10px; }
  button { padding: 12px 16px; font-size: 18px; border: none; border-radius: 10px; background: #34c759; color: #fff; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; background: #fff; padding: 14px; margin-bottom: 8px; border-radius: 10px; font-size: 18px; }
  li.done span { text-decoration: line-through; color: #999; }
  li span { flex: 1; }
  .del { background: none; color: #ff3b30; padding: 0 4px; font-size: 22px; }
  .clear { background: #ff3b30; width: 100%; margin-top: 8px; }
  input[type=checkbox] { width: 24px; height: 24px; }
</style>
</head>
<body>
<h1>🛒 Einkaufsliste</h1>
<div class="row">
  <input type="text" id="item" placeholder="Artikel hinzufügen...">
  <button onclick="add()">+</button>
</div>
<ul id="list"></ul>
<button class="clear" onclick="clearDone()">Ausgewählte löschen</button>

<script>
let items = [];
try { items = JSON.parse(localStorage.getItem("items")) || []; } catch (e) {}

function save() {
  try { localStorage.setItem("items", JSON.stringify(items)); } catch (e) {}
}

function render() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  items.forEach((it, i) => {
    const li = document.createElement("li");
    if (it.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = it.done;
    cb.onchange = () => { it.done = cb.checked; save(); render(); };
    const sp = document.createElement("span");
    sp.textContent = it.text;
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = () => { items.splice(i, 1); save(); render(); };
    li.append(cb, sp, del);
    ul.appendChild(li);
  });
}

function add() {
  const input = document.getElementById("item");
  const text = input.value.trim();
  if (!text) return;
  items.push({ text: text, done: false });
  input.value = "";
  save();
  render();
}

function clearDone() {
  items = items.filter(it => !it.done);
  save();
  render();
}

document.getElementById("item").addEventListener("keydown", e => {
  if (e.key === "Enter") add();
});
render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
